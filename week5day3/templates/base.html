{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Task App{% endblock %}</title>
    
    <!-- Global CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <!-- Cutout for page-specific CSS -->
    {% block extra_css %}{% endblock %}
</head>
<body>

    <header>
        {% include "partials/_navbar.html" %}
    </header>

    <main class="container">
        <!-- Main content cutout -->
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Task Manager Inc.</p>
    </footer>

    <!-- Cutout for page-specific JS -->
    {% block extra_js %}{% endblock %}
</body>
</html>
