{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Task App{% endblock %}</title>
    
    <!-- Task 1: Static file loading -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>

    <header>
        <!-- Task 4: Including a partial -->
        {% include "partials/_navbar.html" %}
    </header>

    <main class="container" style="padding: 20px;">
        {% block content %}{% endblock %}
    </main>

    <footer style="text-align: center; margin-top: 50px; font-size: 0.8rem;">
        <p>&copy; 2026 Task Manager Inc.</p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
